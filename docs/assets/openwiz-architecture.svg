<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>OpenWiz proposed product architecture, version 0.0.0</title>
  <!-- Editable source. Export: 1600x900 at 2.4x = 3840x2160 PNG. Colours follow OpenWiz visual style v1. -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f8691"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0e0f11"/>
  <rect x="6" y="6" width="1588" height="888" rx="14" fill="none" stroke="#552583" stroke-width="4"/>

  <!-- Header -->
  <text x="80" y="86" font-size="52" font-weight="700" fill="#e8eaed">OpenWiz</text>
  <text x="80" y="126" font-size="26" fill="#a3a9b2">Personal agents. Shared memory. A factory for every project.</text>
  <rect x="1200" y="52" width="320" height="40" rx="20" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="1360" y="78" font-size="19" font-weight="600" text-anchor="middle" fill="#A78BFA">Proposed architecture · 0.0.0</text>
  <line x1="1158" y1="121" x2="1196" y2="121" stroke="#7f8691" stroke-width="1.75" stroke-dasharray="6 5"/>
  <text x="1520" y="127" font-size="18" text-anchor="end" fill="#a3a9b2">All proposed · dashed = unverified link</text>

  <!-- Integration targets -->
  <text x="800" y="180" font-size="18" text-anchor="middle" fill="#a3a9b2">Integration targets</text>
  <g fill="#151719" stroke="#3a3f46" stroke-width="1.5">
    <rect x="420" y="194" width="160" height="56" rx="12"/>
    <rect x="620" y="194" width="200" height="56" rx="12"/>
    <rect x="860" y="194" width="320" height="56" rx="12"/>
  </g>
  <g font-size="22" font-weight="600" text-anchor="middle" fill="#e8eaed">
    <text x="500" y="229">dot</text>
    <text x="720" y="229">Grok Bot</text>
    <text x="1020" y="229">Other personal agents</text>
  </g>
  <g fill="none" stroke="#7f8691" stroke-width="1.75" stroke-dasharray="6 5" marker-start="url(#ah)" marker-end="url(#ah)">
    <path d="M500,250 C500,280 760,270 760,298"/>
    <path d="M720,250 C720,276 800,272 800,298"/>
    <path d="M1020,250 C1020,280 840,270 840,298"/>
  </g>

  <!-- PACP -->
  <rect x="560" y="300" width="480" height="56" rx="12" fill="#151719" stroke="#3a3f46" stroke-width="1.5"/>
  <text x="800" y="324" font-size="22" font-weight="700" text-anchor="middle" fill="#e8eaed">PACP</text>
  <text x="800" y="346" font-size="17" text-anchor="middle" fill="#a3a9b2">Personal Agent Connection Protocol · draft</text>
  <path d="M800,356 L800,398" fill="none" stroke="#7f8691" stroke-width="1.75" stroke-dasharray="6 5" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- Controller (accent) -->
  <rect x="570" y="400" width="460" height="108" rx="14" fill="#1c1e21" stroke="#A78BFA" stroke-width="2.25"/>
  <text x="800" y="440" font-size="28" font-weight="700" text-anchor="middle" fill="#e8eaed">OpenWiz Controller</text>
  <text x="800" y="470" font-size="20" text-anchor="middle" fill="#e8eaed">One Rust core · CLI-first</text>
  <text x="800" y="496" font-size="18" text-anchor="middle" fill="#a3a9b2">State · permissions · routing · coordination</text>

  <!-- Web -->
  <rect x="1120" y="400" width="280" height="80" rx="12" fill="#151719" stroke="#3a3f46" stroke-width="1.5"/>
  <text x="1260" y="430" font-size="22" font-weight="700" text-anchor="middle" fill="#e8eaed">OpenWiz Web</text>
  <text x="1260" y="455" font-size="17" text-anchor="middle" fill="#a3a9b2">Next.js client · graph + controls</text>
  <text x="1260" y="473" font-size="14" text-anchor="middle" fill="#7f8691">presentation state only</text>
  <path d="M1032,440 L1118,440" fill="none" stroke="#7f8691" stroke-width="1.75" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- Shared memory -->
  <rect x="110" y="404" width="380" height="90" rx="12" fill="#151719" stroke="#3a3f46" stroke-width="1.5"/>
  <text x="300" y="442" font-size="24" font-weight="700" text-anchor="middle" fill="#e8eaed">Shared memory</text>
  <text x="300" y="472" font-size="17" text-anchor="middle" fill="#a3a9b2">Your private GitHub repo · scoped access</text>
  <path d="M492,452 L568,452" fill="none" stroke="#7f8691" stroke-width="1.75" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- CloudRoom container -->
  <rect x="230" y="552" width="1140" height="290" rx="18" fill="none" stroke="#2c3036" stroke-width="1.25"/>
  <text x="800" y="580" font-size="18" text-anchor="middle" fill="#a3a9b2">CloudRoom · initial execution backend</text>

  <!-- Controller to factories (unverified route), and status back -->
  <g fill="none" stroke="#7f8691" stroke-width="1.75" stroke-dasharray="6 5">
    <path d="M800,508 V530 H520 V594" marker-end="url(#ah)"/>
    <path d="M800,530 H1080 V594" marker-end="url(#ah)"/>
    <path d="M1260,594 C1260,540 1100,510 1032,500" marker-end="url(#ah)"/>
  </g>
  <text x="1205" y="522" font-size="17" fill="#a3a9b2">Status + results</text>

  <!-- Factory A -->
  <g>
    <rect x="270" y="596" width="500" height="226" rx="14" fill="#151719" stroke="#3a3f46" stroke-width="1.5"/>
    <text x="520" y="632" font-size="23" font-weight="700" text-anchor="middle" fill="#e8eaed">Project A factory</text>
    <text x="520" y="660" font-size="18" text-anchor="middle" fill="#a3a9b2">Project orchestrator · under the controller</text>
    <g fill="#1c1e21" stroke="#3a3f46" stroke-width="1.25">
      <rect x="290" y="684" width="86" height="38" rx="19"/>
      <rect x="398" y="684" width="80" height="38" rx="19"/>
      <rect x="500" y="684" width="80" height="38" rx="19"/>
      <rect x="602" y="684" width="100" height="38" rx="19"/>
      <rect x="541" y="752" width="100" height="34" rx="17"/>
    </g>
    <g font-size="18" text-anchor="middle" fill="#e8eaed">
      <text x="333" y="709">Proof</text>
      <text x="438" y="709">Build</text>
      <text x="540" y="709">Test</text>
      <text x="652" y="709">Review</text>
      <text x="591" y="775" font-size="17">Rework</text>
    </g>
    <g fill="none" stroke="#7f8691" stroke-width="1.5" marker-end="url(#ah)">
      <path d="M376,703 L396,703"/>
      <path d="M478,703 L498,703"/>
      <path d="M580,703 L600,703"/>
      <path d="M660,722 C660,769 652,769 643,769"/>
      <path d="M541,769 C525,769 525,745 525,724"/>
      <path d="M690,722 L690,778"/>
    </g>
    <text x="750" y="804" font-size="17" font-weight="600" text-anchor="end" fill="#FDB927">Policy gate</text>
  </g>

  <!-- Factory B -->
  <g>
    <rect x="830" y="596" width="500" height="226" rx="14" fill="#151719" stroke="#3a3f46" stroke-width="1.5"/>
    <text x="1080" y="632" font-size="23" font-weight="700" text-anchor="middle" fill="#e8eaed">Project B factory</text>
    <text x="1080" y="660" font-size="18" text-anchor="middle" fill="#a3a9b2">Project orchestrator · under the controller</text>
    <g fill="#1c1e21" stroke="#3a3f46" stroke-width="1.25">
      <rect x="850" y="684" width="86" height="38" rx="19"/>
      <rect x="958" y="684" width="80" height="38" rx="19"/>
      <rect x="1060" y="684" width="80" height="38" rx="19"/>
      <rect x="1162" y="684" width="100" height="38" rx="19"/>
      <rect x="1101" y="752" width="100" height="34" rx="17"/>
    </g>
    <g font-size="18" text-anchor="middle" fill="#e8eaed">
      <text x="893" y="709">Proof</text>
      <text x="998" y="709">Build</text>
      <text x="1100" y="709">Test</text>
      <text x="1212" y="709">Review</text>
      <text x="1151" y="775" font-size="17">Rework</text>
    </g>
    <g fill="none" stroke="#7f8691" stroke-width="1.5" marker-end="url(#ah)">
      <path d="M936,703 L956,703"/>
      <path d="M1038,703 L1058,703"/>
      <path d="M1140,703 L1160,703"/>
      <path d="M1220,722 C1220,769 1212,769 1203,769"/>
      <path d="M1101,769 C1085,769 1085,745 1085,724"/>
      <path d="M1250,722 L1250,778"/>
    </g>
    <text x="1310" y="804" font-size="17" font-weight="600" text-anchor="end" fill="#FDB927">Policy gate</text>
  </g>

  <!-- Footer -->
  <text x="800" y="874" font-size="19" text-anchor="middle" fill="#a3a9b2">Design preview: nothing shown is built · Proof = claims and evidence, defined before Build</text>
</svg>
