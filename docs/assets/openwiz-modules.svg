<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>OpenWiz planned monorepo modules and dependency direction, version 0.0.0</title>
  <!-- Editable source. Export: 1600x900 at 2.4x = 3840x2160 PNG. Colours follow OpenWiz visual style v1. -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f8691"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0e0f11"/>
  <rect x="6" y="6" width="1588" height="888" rx="14" fill="none" stroke="#552583" stroke-width="4"/>

  <!-- Header -->
  <text x="80" y="86" font-size="52" font-weight="700" fill="#e8eaed">OpenWiz monorepo</text>
  <text x="80" y="126" font-size="26" fill="#a3a9b2">Planned modules. Dependencies point inward.</text>
  <rect x="1200" y="52" width="320" height="40" rx="20" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="1360" y="78" font-size="19" font-weight="600" text-anchor="middle" fill="#A78BFA">Planned · nothing built · 0.0.0</text>
  <text x="1520" y="127" font-size="18" text-anchor="end" fill="#a3a9b2">→ depends on · dashed = unverified · dotted = checks</text>

  <!-- Tests: dotted checks to clients and core -->
  <g fill="none" stroke="#7f8691" stroke-width="1.5" stroke-dasharray="2 5" marker-end="url(#ah)">
    <path d="M210,372 V168 H940 V194"/>
    <path d="M480,168 V194"/>
    <path d="M342,417 L426,417"/>
  </g>
  <text x="575" y="160" font-size="16" text-anchor="middle" fill="#7f8691">tests check every surface</text>

  <!-- Clients -->
  <g fill="#151719" stroke="#3a3f46" stroke-width="1.5">
    <rect x="300" y="196" width="360" height="96" rx="12"/>
    <rect x="760" y="196" width="360" height="96" rx="12"/>
  </g>
  <rect x="1200" y="196" width="280" height="80" rx="12" fill="none" stroke="#3a3f46" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g text-anchor="middle">
    <text x="480" y="229" font-size="22" font-weight="700" fill="#e8eaed" font-family="ui-monospace, 'SF Mono', Menlo, monospace">crates/cli</text>
    <text x="480" y="258" font-size="17" fill="#a3a9b2">Thin client · CLI-first</text>
    <text x="940" y="229" font-size="22" font-weight="700" fill="#e8eaed" font-family="ui-monospace, 'SF Mono', Menlo, monospace">apps/web</text>
    <text x="940" y="258" font-size="17" fill="#a3a9b2">Thin client · Next.js · polished UI</text>
    <text x="480" y="281" font-size="15" fill="#7f8691">presentation state only</text>
    <text x="940" y="281" font-size="15" fill="#7f8691">presentation state only</text>
    <text x="1340" y="229" font-size="20" font-weight="600" fill="#a3a9b2">Desktop packaging</text>
    <text x="1340" y="258" font-size="17" fill="#7f8691">later · undecided</text>
  </g>

  <!-- Clients to core -->
  <g fill="none" stroke="#7f8691" stroke-width="1.75" marker-end="url(#ah)">
    <path d="M480,292 C480,336 600,326 600,360"/>
    <path d="M940,292 C940,336 820,326 820,360"/>
    <path d="M1080,292 C1080,336 1180,330 1180,368"/>
  </g>
  <text x="520" y="346" font-size="16" text-anchor="end" fill="#a3a9b2">operations</text>
  <text x="900" y="346" font-size="16" fill="#a3a9b2">same operations</text>
  <text x="1150" y="324" font-size="16" fill="#a3a9b2">generated types</text>

  <!-- Core (accent) -->
  <rect x="430" y="362" width="560" height="110" rx="14" fill="#1c1e21" stroke="#A78BFA" stroke-width="2.25"/>
  <text x="710" y="400" font-size="26" font-weight="700" text-anchor="middle" fill="#e8eaed" font-family="ui-monospace, 'SF Mono', Menlo, monospace">crates/core</text>
  <text x="710" y="430" font-size="19" text-anchor="middle" fill="#e8eaed">The controller: state · permissions · routing · coordination</text>
  <text x="710" y="456" font-size="17" text-anchor="middle" fill="#a3a9b2">Operations and rules · defines adapter interfaces</text>

  <!-- Contracts -->
  <rect x="1120" y="370" width="360" height="94" rx="12" fill="#151719" stroke="#3a3f46" stroke-width="1.5"/>
  <text x="1300" y="403" font-size="22" font-weight="700" text-anchor="middle" fill="#e8eaed" font-family="ui-monospace, 'SF Mono', Menlo, monospace">contracts/</text>
  <text x="1300" y="430" font-size="17" text-anchor="middle" fill="#a3a9b2">Shared schemas · decision types</text>
  <text x="1300" y="452" font-size="17" text-anchor="middle" fill="#a3a9b2">PACP schemas · test fixtures</text>
  <path d="M992,417 L1118,417" fill="none" stroke="#7f8691" stroke-width="1.75" marker-end="url(#ah)"/>

  <!-- Tests -->
  <rect x="80" y="372" width="260" height="90" rx="12" fill="#151719" stroke="#3a3f46" stroke-width="1.5"/>
  <text x="210" y="408" font-size="22" font-weight="700" text-anchor="middle" fill="#e8eaed" font-family="ui-monospace, 'SF Mono', Menlo, monospace">tests/</text>
  <text x="210" y="436" font-size="17" text-anchor="middle" fill="#a3a9b2">Same operation,</text>
  <text x="210" y="455" font-size="17" text-anchor="middle" fill="#a3a9b2">same result everywhere</text>

  <!-- Adapters -->
  <rect x="430" y="566" width="560" height="94" rx="12" fill="#151719" stroke="#3a3f46" stroke-width="1.5"/>
  <text x="710" y="600" font-size="22" font-weight="700" text-anchor="middle" fill="#e8eaed" font-family="ui-monospace, 'SF Mono', Menlo, monospace">crates/adapters/*</text>
  <text x="710" y="628" font-size="17" text-anchor="middle" fill="#a3a9b2">One per external service · implements core interfaces</text>
  <text x="710" y="649" font-size="15" text-anchor="middle" fill="#7f8691">integration bookkeeping only · never policy</text>
  <g fill="none" stroke="#7f8691" stroke-width="1.75" marker-end="url(#ah)">
    <path d="M710,566 L710,474"/>
    <path d="M990,613 C1300,613 1300,540 1300,466"/>
  </g>
  <text x="722" y="526" font-size="16" fill="#a3a9b2">implements</text>

  <!-- External services (unverified) -->
  <path d="M710,660 L710,734" fill="none" stroke="#7f8691" stroke-width="1.75" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <text x="722" y="704" font-size="16" fill="#a3a9b2">talks to</text>
  <rect x="300" y="736" width="820" height="72" rx="12" fill="none" stroke="#3a3f46" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="710" y="767" font-size="20" font-weight="600" text-anchor="middle" fill="#e8eaed">External services · no OpenWiz adapter built yet</text>
  <text x="710" y="793" font-size="17" text-anchor="middle" fill="#a3a9b2">CloudRoom · GitHub · personal agents via PACP · memory repository</text>

  <!-- Footer -->
  <text x="800" y="852" font-size="18" text-anchor="middle" fill="#a3a9b2">Clients keep presentation state only, never authoritative product state · adapters never own policy</text>
  <text x="800" y="878" font-size="18" text-anchor="middle" fill="#a3a9b2">Also shared: docs/ · CLI-first and a polished UI are both goals · the private beta uses this same layout</text>
</svg>
